<!DOCTYPE html>
<html>
<head>
    <title>🎌 Anime Search</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ff6b9d;
            font-size: 36px;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        #searchInput {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #0f0f1e;
            color: #eee;
        }
        #searchInput:focus {
            outline: none;
            border-color: #ff6b9d;
        }
        #searchBtn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background: #ff6b9d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #searchBtn:hover:not(:disabled) { background: #ff4d85; }
        #searchBtn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            border: 4px solid rgba(255,107,157,0.2);
            border-top: 4px solid #ff6b9d;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        .spinner.show { display: block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            text-align: center;
            font-size: 16px;
            margin: 20px 0;
            min-height: 24px;
        }
        #message.error { color: #e74c3c; }
        #message.info { color: #ff6b9d; }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,107,157,0.2);
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255,107,157,0.3);
        }
        .anime-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        .anime-info {
            padding: 12px;
        }
        .anime-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 8px;
            color: #ff6b9d;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }   
        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
        }
        .score {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎌 Anime Search</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search anime... (e.g., Naruto)">
            <button id="searchBtn">Search</button>
        </div>

        <div class="spinner" id="spinner"></div>
        <p id="message">Enter an anime title to search</p>

        <div id="results"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
